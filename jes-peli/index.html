<title>Mikä JES-tapahtuma olet?</title>

<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: one-screen game card on JES turquoise, styled like an embroidered overall patch (stitched borders) in JES logo colours. Single committed look. */
:root{
  --ground:#37B9D7;      /* JES-sivuston turkoosi */
  --patch:#FFFFFF;
  --ink:#181818;         /* logon musta */
  --sun:#FFCA44;         /* logon keltainen */
  --coral:#DB1D42;       /* logon tummanpunainen */
  --coral-deep:#A3122F;
  --orange:#FAAA41;      /* logon oranssi */
  --sky:#61AADE;         /* logon sininen */
  --teal-ink:#16708A;    /* turkoosi tekstinä, luettava valkoisella */
  --muted:#4B4F55;
  --display:"Hind Madurai", Helvetica, Arial, sans-serif;
  --body:"Hind Madurai", Helvetica, Arial, sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;
  background-image:radial-gradient(circle at 20% 10%, rgba(255,255,255,.08) 0 2px, transparent 3px),radial-gradient(circle at 70% 60%, rgba(255,255,255,.06) 0 2px, transparent 3px);
  background-size:38px 38px, 52px 52px;}
.wrap{min-height:100%;display:flex;align-items:center;justify-content:center;
  padding-block:20px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));box-sizing:border-box}
.patch{position:relative;width:100%;max-width:560px;background:var(--patch);border-radius:28px;padding:22px 22px 24px;box-sizing:border-box;
  box-shadow:0 0 0 6px var(--patch), 0 0 0 9px var(--sun), 0 18px 40px rgba(8,60,80,.35);}
.patch::before{content:"";position:absolute;inset:8px;border:2.5px dashed var(--sun);border-radius:22px;pointer-events:none;opacity:.9}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;position:relative}
.brand{display:block;width:64px;height:64px;margin:-6px 0 -6px -4px}
.lang{display:flex;gap:4px;background:#EEF7FA;border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;font:700 13px var(--body);color:var(--muted);padding:6px 11px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
.screen{position:relative;display:flex;flex-direction:column;gap:16px;padding-top:14px}
h1,h2{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;line-height:1.05}
h1{font-size:clamp(34px,9vw,52px);letter-spacing:-.02em}
h2{font-size:clamp(24px,6.4vw,32px);letter-spacing:-.01em}
p{margin:0;line-height:1.5}
.lead{font-size:17px;color:var(--muted);max-width:40ch}
.duo{display:flex;align-items:flex-end;gap:10px;min-height:120px}
.alp{width:96px;height:112px;flex:none}
.alp.small{width:64px;height:76px}
.bubble{position:relative;background:var(--sun);color:var(--ink);font-weight:600;border-radius:18px;padding:11px 14px;font-size:15px;line-height:1.35;margin-bottom:42px;min-width:0}
.bubble b{display:block;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.bubble::after{content:"";position:absolute;left:-8px;bottom:14px;border:8px solid transparent;border-right-color:var(--sun);border-left:0}
.btn{appearance:none;border:0;cursor:pointer;font-family:var(--display);font-weight:700;font-size:21px;border-radius:16px;padding:15px 20px 13px;
  background:var(--coral);color:#fff;box-shadow:0 5px 0 var(--coral-deep);transition:transform .08s, box-shadow .08s;text-align:center;text-decoration:none;display:block}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--coral-deep)}
.btn:focus-visible,.opt:focus-visible,.lang button:focus-visible,.link:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.stitches{display:flex;gap:8px}
.stitches i{flex:1;height:6px;border-radius:3px;background:#E4EEF2}
.stitches i.on{background:var(--coral)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{appearance:none;cursor:pointer;border:2.5px solid var(--ink);background:#fff;border-radius:18px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;
  font:700 15px/1.25 var(--body);color:var(--ink);min-height:128px;justify-content:center;text-align:center;transition:transform .12s, background .12s}
.opt .ic{font-size:40px;line-height:1}
.opt:hover{background:#FFF4D6}
.opt.picked{background:var(--sun);transform:scale(.96)}
.result-name{color:var(--coral)}
.kicker{font:700 13px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fact{font-size:17px}
.jes{font-size:14px;color:var(--muted);border-top:2px dashed #E4EEF2;padding-top:12px}
.cta{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.cta-main{display:flex;flex-direction:column;gap:10px;min-width:0}
.cta small{font-size:14px;color:var(--muted);line-height:1.4}
.qr{display:flex;flex-direction:column;align-items:center;gap:6px;font:600 12px var(--body);color:var(--muted)}
.qr #qrbox{background:var(--patch);padding:6px;border-radius:10px;border:2px solid var(--ink);line-height:0}
.qr #qrbox img,.qr #qrbox canvas{width:104px;height:104px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.link{color:var(--teal-ink);font-weight:700;font-size:15px}
.again{appearance:none;border:2.5px solid var(--ink);background:transparent;border-radius:999px;padding:9px 16px;font:700 15px var(--body);color:var(--ink);cursor:pointer}
.pop{animation:pop .35s ease-out}
@keyframes pop{from{transform:translateY(10px);opacity:.3}to{transform:none;opacity:1}}
.alp.bob{animation:bob 2.4s ease-in-out infinite}
.alp.bob.late{animation-delay:-1.2s}
@keyframes bob{50%{transform:translateY(-4px)}}
.qr-toggle{position:fixed;right:calc(12px + env(safe-area-inset-right, 0px));bottom:calc(12px + env(safe-area-inset-bottom, 0px));z-index:5;
  appearance:none;border:0;cursor:pointer;width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.22);color:#fff;display:grid;place-items:center;opacity:.75}
.qr-toggle:hover,.qr-toggle:focus-visible{opacity:1;background:rgba(255,255,255,.35)}
.qr-toggle:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.qr-toggle svg{width:24px;height:24px}
.qrview{align-items:center;text-align:center;gap:14px}
.qrview .big{background:#fff;padding:14px;border-radius:18px;border:3px solid var(--ink);line-height:0}
.qrview .big img,.qrview .big canvas{width:min(68vw,340px);height:min(68vw,340px)}
.qrview .url{font-size:15px;color:var(--muted);word-break:break-all}
.qrview .duo{justify-content:center;min-height:0}
.qrview .alp{width:72px;height:84px}
@media (max-width:560px){
  .duo{flex-wrap:wrap;gap:6px 8px;min-height:0}
  .duo .bubble{order:-1;flex:1 1 100%;margin:0 0 6px}
  .duo .bubble::after{left:34px;bottom:-8px;border:8px solid transparent;border-top-color:var(--sun);border-bottom:0}
  .alp{width:76px;height:88px}
}
@media (max-width:560px){ .qr{display:none} .cta{grid-template-columns:1fr} .opt{min-height:112px} .opt .ic{font-size:34px} .patch{padding:18px 16px 20px} }
@media (prefers-reduced-motion:reduce){ .pop,.alp.bob{animation:none} .opt,.btn{transition:none} }
</style>
</head>

}
function bindLang(){
  document.getElementById("lang-fi").onclick=()=>{lang="fi";render();};
  document.getElementById("lang-en").onclick=()=>{lang="en";render();};
}

// QR-koodi vie sivun omaan julkiseen osoitteeseen. Jos sivua katsotaan muualta (esim. Claude-esikatselu),
// käytetään varaosoitetta, jottei QR osoita tekniseen esikatseluosoitteeseen.
const FALLBACK_URL = "https://miska-labs.pages.dev/jes-peli/";
const PLAY_URL = (location.protocol.startsWith("http") && !/claude|anthropic|localhost/.test(location.host))
  ? location.origin + location.pathname : FALLBACK_URL;
let showQR = false;

function render(){
  armIdle();
  qrToggle();
  if(showQR) return renderQRView();
  if(step<0) return renderStart();
  if(step<QS.length) return renderQ();
  renderResult();
}

function renderStart(){
  app.innerHTML = header() + `<section class="screen pop">
    <h1>${t("start_title")}</h1>
    <p class="lead">${t("start_lead")}</p>
    <div class="duo">${alpaca("jorma","bob")}${alpaca("birgitta","bob late")}<div class="bubble">${t("hello")}</div></div>
    <button class="btn" id="go">${t("start_btn")}</button></section>`;
  svgFix(); bindLang();
  document.getElementById("go").onclick=()=>{step=0;score={};render();};
}

function renderQ(){
  const q = QS[step];
  const st = QS.map((_,i)=>`<i class="${i<=step?"on":""}"></i>`).join("");
  app.innerHTML = header() + `<section class="screen pop">
    <div class="stitches" aria-label="${t("q")} ${step+1}${t("of")}${QS.length}">${st}</div>
    <span class="kicker">${t("q")} ${step+1}${t("of")}${QS.length}</span>
    <h2>${q[lang]}</h2>
    <div class="opts">${q.opts.map((o,i)=>`<button class="opt" id="opt-${step}-${i}" data-i="${i}"><span class="ic" aria-hidden="true">${o.ic}</span>${o[lang]}</button>`).join("")}</div>
    </section>`;
  bindLang();
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const o = q.opts[+b.dataset.i];
    for(const k in o.w) score[k]=(score[k]||0)+o.w[k];
    score._last = o.w;
    b.classList.add("picked");
    app.querySelectorAll(".opt").forEach(x=>x.disabled=true);
    setTimeout(()=>{step++;render();}, 260);
  });
}

function winner(){
  // Tasatilanteessa ratkaisee viimeinen vastaus, sitten kiinteä järjestys.
  let best=null;
  for(const k of ORDER){
    const s=score[k]||0, b=best?score[best]||0:-1;
    if(s>b || (s===b && (score._last[k]||0)>(score._last[best]||0))) best=k;
  }
  return best;
}

function renderResult(){
  if(!score._key) score._key = winner();
  const r = RES[score._key], c = r[lang];
  app.innerHTML = header() + `<section class="screen pop">
    <span class="kicker">${t("you_are")}</span>
    <h1 class="result-name">${c.name} <span aria-hidden="true">${r.ic}</span></h1>
    <p class="fact">${c.fact}</p>
    <div class="duo">${alpaca(r.who,"bob")}<div class="bubble"><b>${r.who==="jorma"?"Jorma":"Birgitta"}</b>${c.say}</div></div>
    <div class="cta">
      <div class="cta-main">
        <a class="btn ig" href="${IG}" target="_blank" rel="noopener">${t("follow")}</a>
        <small>${t("follow_hint")(c.short)}</small>
      </div>
      <div class="qr"><div id="qrbox"></div><span>${t("scan")}</span></div>
    </div>
    <p class="jes">${t("jes")}</p>
    <div class="row"><a class="link" href="${LI}" target="_blank" rel="noopener">${t("li")}</a>
      <button class="again" id="again">${t("again")}</button></div>
    </section>`;
  svgFix(); bindLang();
  try{ if(window.QRCode) new QRCode(document.getElementById("qrbox"),{text:IG,width:208,height:208,colorDark:"#181818",colorLight:"#FFFFFF",correctLevel:QRCode.CorrectLevel.M}); }catch(e){}
  document.getElementById("again").onclick=reset;
}

// Pieni QR-nappi oikeassa alanurkassa, vain aloitusnäkymässä. Se on pisteen pitäjää varten, ei pelaajaa.
function qrToggle(){
  let b = document.getElementById("qr-toggle");
  const visible = step<0 && !showQR;
  if(!b){
    b = document.createElement("button"); b.id="qr-toggle"; b.className="qr-toggle";
    b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></svg>';
    b.onclick = ()=>{ showQR=true; render(); };
    document.body.appendChild(b);
  }
  b.setAttribute("aria-label", t("qr_btn")); b.title = t("qr_btn");
  b.hidden = !visible;
}

function renderQRView(){
  app.innerHTML = header() + `<section class="screen qrview pop">
    <h2>${t("qr_title")}</h2>
    <div class="big" id="qrbig"></div>
    <p class="url">${PLAY_URL.replace(/^https?:\/\//,"")}</p>
    <p class="lead">${t("qr_lead")}</p>
    <div class="duo">${alpaca("jorma","bob")}${alpaca("birgitta","bob late")}</div>
    <button class="again" id="qr-close">${t("qr_close")}</button>
    </section>`;
  svgFix(); bindLang();
  try{ if(window.QRCode) new QRCode(document.getElementById("qrbig"),{text:PLAY_URL,width:512,height:512,colorDark:"#181818",colorLight:"#FFFFFF",correctLevel:QRCode.CorrectLevel.M}); }catch(e){}
  document.getElementById("qr-close").onclick=()=>{ showQR=false; render(); };
}

function reset(){ step=-1; score={}; render(); }
function armIdle(){ clearTimeout(idle); if(step>=0) idle=setTimeout(reset, IDLE_MS); }
["pointerdown","keydown"].forEach(ev=>document.addEventListener(ev, ()=>{ if(step>=0) armIdle(); }, {passive:true}));

render();
</script>

</body>
</html>
