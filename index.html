<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Miska Labs</title>
<style>
  :root{--bg:#F4F6F8;--fg:#1B1F24;--muted:#5A6470;--line:#D9DEE4;--accent:#1F6FEB}
  @media (prefers-color-scheme:dark){:root{--bg:#14171B;--fg:#E8ECF0;--muted:#9AA5B1;--line:#2A3038;--accent:#6CA6FF}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:640px;margin:0 auto;padding:48px 20px}
  h1{font-size:28px;margin:0 0 4px}
  p{margin:0 0 24px;color:var(--muted)}
  ul{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
  li{border-bottom:1px solid var(--line)}
  a{display:flex;justify-content:space-between;gap:16px;padding:14px 0;color:var(--fg);text-decoration:none}
  a:hover b{color:var(--accent)}
  span{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>
  <h1>Miska Labs</h1>
  <p>Kokeiluja, pelejä ja prototyyppejä.</p>
  <ul>
    <li><a href="/jes-peli/"><b>Mikä JES-tapahtuma olet?</b><span>JES · 2026</span></a></li>
  </ul>
</main>
</body>
</html>
